name: Build Penny VPN APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Libv2ray Core
        run: |
          mkdir -p V2rayNG/app/libs
          curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest \
          | grep "browser_download_url.*libv2ray.aar" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi - -O V2rayNG/app/libs/libv2ray.aar
          ls -lh V2rayNG/app/libs/

      - name: Grant execute permission for gradlew
        run: |
          cd V2rayNG
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace

      - name: Upload Penny VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Penny-VPN-Installer
          path: V2rayNG/app/build/outputs/apk/**/*.apk
