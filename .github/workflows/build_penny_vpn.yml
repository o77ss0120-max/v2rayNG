name: Build Penny VPN Release APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Prepare Release Keystore (Deterministic Signature)
        working-directory: V2rayNG
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            echo "SIGNING_STORE_FILE=release-keystore.jks" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            # استفاده از کلید امضای ثابت ریپو (penny-release-keystore.p12) تا آپدیت‌ها بدون خطای ناسازگاری امضا روی نسخه قبلی نصب شوند
            cp app/penny-release-keystore.p12 app/release-keystore.jks
            echo "SIGNING_STORE_FILE=release-keystore.jks" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=PennyReleaseKey2026!" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=pennyvpn" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=PennyReleaseKey2026!" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for gradlew
        working-directory: V2rayNG
        run: chmod +x gradlew

      - name: Build Signed Playstore Release APK
        working-directory: V2rayNG
        run: ./gradlew assemblePlaystoreRelease --stacktrace

      - name: Upload Signed Universal & ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: PennyVPN-v2.6.2-Signed-APKs
          path: V2rayNG/app/build/outputs/apk/playstore/release/*.apk

      - name: Publish GitHub Release (for In-App Update Button)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.6.2
          name: "Penny VPN v2.6.2 (Clean IP Scanner, ISP Auto-Tuner & Network Doctor)"
          body: |
            ### Penny VPN v2.6.2 — Connects When Others Can't
            - **Preserve User Configs**: Scanning subscription servers never deletes or renames user-imported configs.
            - **On-Device Clean IP Scanner & Network Doctor**: Probes 14 Cloudflare Anycast ranges across ports `443`, `8443`, and `2083` to bypass ISP DNS poisoning (`10.10.34.36`) and SNI filtering.
            - **Iran ISP Auto-Tuner & Direct Routing**: Automatically tunes TLS ClientHello Fragment size for Irancell, Hamrah Aval (MCI), Rightel, and Broadband, while routing `.ir` and Iranian banking apps directly.
            - **Deterministic Release Signature**: Updates install cleanly over previous builds without uninstalling.
          draft: false
          prerelease: false
          files: V2rayNG/app/build/outputs/apk/playstore/release/*.apk
