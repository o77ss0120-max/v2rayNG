name: Build Penny VPN APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Libv2ray Core
        run: |
          mkdir -p V2rayNG/app/libs
          wget -O V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

      - name: Grant execute permission for gradlew
        run: |
          cd V2rayNG
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug

      - name: Upload Penny VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Penny-VPN-Installer
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
