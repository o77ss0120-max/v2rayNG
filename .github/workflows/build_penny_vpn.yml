name: Build Penny VPN Release APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBV2RAY_TAG: "v26.10.31"
  LIBV2RAY_SHA256: "2efdf731b1ed624eb1cb0d5a4d0aa95c0672e89f9702226d1ba2dc90308630b6"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Ensure hev-socks5-tunnel source (Pinned Commit)
        run: |
          if [ ! -f hev-socks5-tunnel/Android.mk ]; then
            rm -rf hev-socks5-tunnel
            git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
            git -C hev-socks5-tunnel checkout 64cc609f945253b0e9ebc56317d544268f3c68c1
            git -C hev-socks5-tunnel submodule update --init --recursive
          fi
          test -f hev-socks5-tunnel/Android.mk

      - name: Build hev-socks5-tunnel
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh
          find libs -name "*.so" | sort

      - name: Copy native libs into app module
        run: |
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/
          test -f V2rayNG/app/libs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Download Pinned Libv2ray Core & Verify SHA-256 Checksum
        run: |
          curl -L --fail --retry 5 -o V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_TAG}/libv2ray.aar"
          echo "${LIBV2RAY_SHA256}  V2rayNG/app/libs/libv2ray.aar" | sha256sum -c -
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Prepare Deterministic Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_FILE="/tmp/penny-release-keystore.p12"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production Release Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
            echo "PENNY_KEYSTORE_FILE=$KS_FILE" >> $GITHUB_ENV
            echo "PENNY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "PENNY_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "PENNY_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Using deterministic repository keystore (V2rayNG/app/penny-release-keystore.p12) so APK updates install cleanly..."
            cp "$GITHUB_WORKSPACE/V2rayNG/app/penny-release-keystore.p12" "$KS_FILE"
            PASS="PennyReleaseKey2026!"
            echo "PENNY_KEYSTORE_FILE=$KS_FILE" >> $GITHUB_ENV
            echo "PENNY_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
            echo "PENNY_KEY_ALIAS=pennyvpn" >> $GITHUB_ENV
            echo "PENNY_KEY_PASSWORD=$PASS" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK (com.penny.vpn)
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assemblePlaystoreRelease --no-daemon

      - name: Verify Native Libs & Release Output
        run: |
          ls -lh V2rayNG/app/build/outputs/apk/playstore/release/
          for f in V2rayNG/app/build/outputs/apk/playstore/release/*.apk; do
            echo "== Verifying $f"
            unzip -l "$f" | grep "libhev-socks5-tunnel.so" || { echo "Missing libhev-socks5-tunnel.so in $f"; exit 1; }
          done

      - name: Package Mobile & Android TV Release APKs
        run: |
          mkdir -p dist_apks
          UNIV_APK=$(ls V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk | head -n 1)
          ARM64_APK=$(ls V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk | head -n 1 || true)
          ARM32_APK=$(ls V2rayNG/app/build/outputs/apk/playstore/release/*armeabi-v7a*.apk | head -n 1 || true)
          cp "$UNIV_APK" dist_apks/PennyVPN-Mobile-v2.8.0-universal.apk
          cp "$UNIV_APK" dist_apks/PennyVPN-AndroidTV-v2.8.0-universal.apk
          if [ -n "$ARM64_APK" ] && [ -f "$ARM64_APK" ]; then
            cp "$ARM64_APK" dist_apks/PennyVPN-AndroidTV-v2.8.0-arm64.apk
          fi
          if [ -n "$ARM32_APK" ] && [ -f "$ARM32_APK" ]; then
            cp "$ARM32_APK" dist_apks/PennyVPN-AndroidTV-v2.8.0-arm32-tvbox.apk
          fi
          ls -lh dist_apks/

      - name: Upload Penny VPN Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Penny-VPN-Mobile-APK
          path: dist_apks/PennyVPN-Mobile-*.apk

      - name: Upload Penny VPN Android TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Penny-VPN-AndroidTV-APK
          path: dist_apks/PennyVPN-AndroidTV-*.apk

      - name: Publish Signed Mobile & Android TV APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.8.0
          name: "Penny VPN v2.8.0 (Mobile + Android TV Edition • 3D Country Globe & Ghost Chat Lock)"
          body: |
            ### Penny VPN v2.8.0 — Mobile & Android TV Edition
            - **Android TV & Google TV Native Support**: Includes Leanback TV Launcher support, D-Pad remote control navigation, and a 2-column widescreen TV layout (`PennyVPN-AndroidTV-v2.8.0-*.apk`).
            - **Interactive 3D World Globe & Blinking Country Radar**: Rotates to the active server country (Netherlands `NL`, Poland `PL`, Germany `DE`) with a pulsing radar beacon and live coordinates.
            - **Ghost Mode Messaging-Only Traffic Lock**: Dedicated status indicator and toggle switch that blocks heavy video/update domains at the SOCKS5 layer, excludes video apps from the VPN tunnel, and caps Ghost bandwidth to `42 KB/s` for emergency messaging without draining private server quota.
            - **Zero-Scroll UI & Unified Obsidian/Champagne-Gold Theme**: Fixed server & VIP card layouts with zero vertical scrolling on Home and Profile.
          files: dist_apks/*.apk
          draft: false
          prerelease: false
