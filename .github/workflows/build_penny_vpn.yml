name: Build Penny VPN APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # اگر ساب‌ماژول در ریپوی شما ثبت نشده بود، مستقیم کلون می‌شود
      - name: Ensure hev-socks5-tunnel source
        run: |
          if [ ! -f hev-socks5-tunnel/Android.mk ] && [ ! -f hev-socks5-tunnel/Makefile ]; then
            rm -rf hev-socks5-tunnel
            git clone https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
            cd hev-socks5-tunnel
            git checkout 64cc609f945253b0e9ebc56317d544268f3c68c1
            git submodule update --init --recursive
          fi
          ls hev-socks5-tunnel | head

      - name: Build hev-socks5-tunnel
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh
          echo "---- نتیجه ----"
          find . -name "libhev-socks5-tunnel.so" -not -path "./hev-socks5-tunnel/*"

      - name: Download Libv2ray Core Directly
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L --retry 5 -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Grant execute permission for gradlew
        run: |
          cd V2rayNG
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assemblePlaystoreDebug --no-daemon

      - name: Verify native libs in APK
        run: |
          for f in V2rayNG/app/build/outputs/apk/playstore/debug/*.apk; do
            echo "$f"
            unzip -l "$f" | grep -E "hev-socks5|libgojni" || echo "!!! کتابخانه‌ها در APK نیست"
          done

      - name: Upload Penny VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Penny-VPN-Installer
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
