name: Build Penny VPN APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # اگر پوشه hev-socks5-tunnel خالی بود (ساب‌ماژول در ریپو ثبت نشده)، مستقیم کلون می‌شود
      - name: Ensure hev-socks5-tunnel source
        run: |
          if [ ! -f hev-socks5-tunnel/Android.mk ]; then
            echo "hev-socks5-tunnel خالی است؛ در حال کلون..."
            rm -rf hev-socks5-tunnel
            git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
            git -C hev-socks5-tunnel checkout 64cc609f945253b0e9ebc56317d544268f3c68c1
            git -C hev-socks5-tunnel submodule update --init --recursive
          fi
          ls hev-socks5-tunnel
          test -f hev-socks5-tunnel/Android.mk

      # این مرحله libhev-socks5-tunnel.so را برای 4 معماری می‌سازد و در <root>/libs/<abi>/ می‌گذارد
      - name: Build hev-socks5-tunnel
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh
          find libs -name "*.so" | sort

      # علت اصلی کرش UnsatisfiedLinkError: Gradle فقط V2rayNG/app/libs را برای .so می‌خواند
      - name: Copy native libs into app module
        run: |
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/
          find V2rayNG/app/libs -name "*.so" | sort
          test -f V2rayNG/app/libs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Download Libv2ray Core Directly
        run: |
          curl -L --fail --retry 5 -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Grant execute permission for gradlew
        run: chmod +x V2rayNG/gradlew

      - name: Build Debug APK
        working-directory: V2rayNG
        run: ./gradlew assemblePlaystoreDebug --no-daemon

      # اگر کتابخانه‌ها داخل APK نباشند، build عمداً شکست می‌خورد
      - name: Verify native libs in APK
        run: |
          ls -lh V2rayNG/app/build/outputs/apk/playstore/debug/
          for f in V2rayNG/app/build/outputs/apk/playstore/debug/*.apk; do
            echo "== $f"
            unzip -l "$f" | grep "libhev-socks5-tunnel.so" || { echo "libhev-socks5-tunnel.so در $f نیست"; exit 1; }
          done

      - name: Upload Penny VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: Penny-VPN-Installer
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
