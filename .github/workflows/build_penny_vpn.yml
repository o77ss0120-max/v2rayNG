name: Build Penny VPN Release APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBV2RAY_TAG: "v26.10.31"
  LIBV2RAY_SHA256: "2efdf731b1ed624eb1cb0d5a4d0aa95c0672e89f9702226d1ba2dc90308630b6"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Ensure hev-socks5-tunnel source (Pinned Commit)
        run: |
          if [ ! -f hev-socks5-tunnel/Android.mk ]; then
            rm -rf hev-socks5-tunnel
            git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
            git -C hev-socks5-tunnel checkout 64cc609f945253b0e9ebc56317d544268f3c68c1
            git -C hev-socks5-tunnel submodule update --init --recursive
          fi
          test -f hev-socks5-tunnel/Android.mk

      - name: Build hev-socks5-tunnel
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh
          find libs -name "*.so" | sort

      - name: Copy native libs into app module
        run: |
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/
          test -f V2rayNG/app/libs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Download Pinned Libv2ray Core & Verify SHA-256 Checksum
        run: |
          curl -L --fail --retry 5 -o V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_TAG}/libv2ray.aar"
          echo "${LIBV2RAY_SHA256}  V2rayNG/app/libs/libv2ray.aar" | sha256sum -c -
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Prepare Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_FILE="/tmp/penny-release-keystore.p12"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production Release Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
            echo "PENNY_KEYSTORE_FILE=$KS_FILE" >> $GITHUB_ENV
            echo "PENNY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "PENNY_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "PENNY_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret not configured. Generating ephemeral CI signing key in /tmp..."
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storetype PKCS12 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -alias pennyvpn \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Penny VPN, OU=Security, O=PennyVPN, L=Amsterdam, S=NH, C=NL"
            echo "PENNY_KEYSTORE_FILE=$KS_FILE" >> $GITHUB_ENV
            echo "PENNY_KEYSTORE_PASSWORD=$EPHEMERAL_PASS" >> $GITHUB_ENV
            echo "PENNY_KEY_ALIAS=pennyvpn" >> $GITHUB_ENV
            echo "PENNY_KEY_PASSWORD=$EPHEMERAL_PASS" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK (com.penny.vpn)
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assemblePlaystoreRelease --no-daemon

      - name: Verify Native Libs & Release Output
        run: |
          ls -lh V2rayNG/app/build/outputs/apk/playstore/release/
          for f in V2rayNG/app/build/outputs/apk/playstore/release/*.apk; do
            echo "== Verifying $f"
            unzip -l "$f" | grep "libhev-socks5-tunnel.so" || { echo "Missing libhev-socks5-tunnel.so in $f"; exit 1; }
          done

      - name: Upload Penny VPN Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Penny-VPN-Release-APK
          path: V2rayNG/app/build/outputs/apk/playstore/release/*.apk

      - name: Publish Signed Mobile APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.9.5
          name: "Penny VPN v2.9.5 (Security Audit Hardening • Strict ECDSA Signatures • R8 Minification)"
          body: |
            ### Penny VPN v2.9.5 — Security Hardened Release
            - **Keystore & Secret Hygiene**: Removed repository `.p12` keystore; signing now exclusively uses GitHub Actions Secrets (`KEYSTORE_BASE64`).
            - **Strict ECDSA P-256 Server List Verification**: Enforced `#PENNY-SIG:` verification on remote subscription lists and removed third-party `ghproxy.net` fallback.
            - **VIP License Hardening**: Removed test/demo codes, revoked legacy public key, enforced strict online activation and JSON token expiration checks.
            - **Network & Manifest Security**: Disabled global cleartext traffic (`usesCleartextTraffic="false"`), restricted loopback cleartext to `127.0.0.1`/`localhost`, and enabled R8 minification.
          files: V2rayNG/app/build/outputs/apk/playstore/release/*.apk
          draft: false
          prerelease: false
